name: Deploy to Databricks

# Manual and environment-gated. Nothing here runs on a push: workspace credentials
# live in the `databricks` GitHub Environment, so a deploy waits for whatever
# reviewers that environment requires.
#
# Environment secrets this expects:
#   DATABRICKS_HOST           https://adb-....azuredatabricks.net
#   DATABRICKS_CLIENT_ID      service principal (OAuth M2M) with CAN_MANAGE on the app
#   DATABRICKS_CLIENT_SECRET  that SP's secret
#   LBX_PROJECTS_PG_HOST      Lakebase instance host for the project store
#   LBX_PROJECTS_PG_USER      Lakebase role the project store connects as
#
# One-time, outside this workflow (see the README): create the secret scope holding
# the Lakebase password and grant the app's own service principal access to it.
# deploy.sh does that locally; this workflow deliberately does not touch ACLs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to deploy (e.g. v0.2.0). Empty builds and deploys this ref."
        required: false
        type: string
      target:
        description: "Bundle target name to render into target.yml"
        required: true
        default: ci
        type: string
      app_name:
        description: "Override the app name (databricks.yml var app_name)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: bundle deploy + run
    runs-on: ubuntu-latest
    environment: databricks
    env:
      # OAuth M2M: the CLI reads these straight from the environment, so the runner
      # needs no profile and no .databrickscfg.
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      LBX_PG_HOST: ${{ secrets.LBX_PROJECTS_PG_HOST }}
      LBX_PG_USER: ${{ secrets.LBX_PROJECTS_PG_USER }}
      VERSION: ${{ inputs.version }}
      TARGET: ${{ inputs.target }}
      APP_NAME: ${{ inputs.app_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve the tree to deploy
        id: tree
        run: |
          set -euo pipefail
          if [ -n "${VERSION}" ]; then
            # Deploy the exact bytes that were released, checksum-verified — that is
            # what makes a redeploy of v0.2.0 six months from now reproducible.
            dir="${RUNNER_TEMP}/release"
            mkdir -p "${dir}"
            gh release download "${VERSION}" --dir "${dir}" \
              --pattern '*.tar.gz' --pattern 'SHA256SUMS'
            (cd "${dir}" && sha256sum -c SHA256SUMS)
            tar -xzf "${dir}"/*.tar.gz -C "${RUNNER_TEMP}"
            printf 'dir=%s\n' "${RUNNER_TEMP}/lakebase-express-${VERSION#v}" >> "${GITHUB_OUTPUT}"
          else
            # No tag given: build this ref the same way deploy.sh would.
            (cd frontend && npm ci && npm run build)
            printf 'dir=%s\n' "${GITHUB_WORKSPACE}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install the Databricks CLI
        # Installer fetched at a tag, so the CLI version is pinned rather than
        # "whatever main installs today".
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v1.17.0/install.sh | sh

      - name: Render target.yml
        # target.yml is gitignored (per-user), so CI writes its own: the workspace
        # host plus the two variables databricks.yml intentionally leaves without a
        # default. Secrets reach the file through the environment, never the log.
        working-directory: ${{ steps.tree.outputs.dir }}
        run: |
          set -euo pipefail
          {
            printf 'targets:\n'
            printf '  %s:\n' "${TARGET}"
            printf '    workspace:\n'
            printf '      host: %s\n' "${DATABRICKS_HOST}"
            printf '    variables:\n'
            printf '      projects_pg_host: %s\n' "${LBX_PG_HOST}"
            printf '      projects_pg_user: %s\n' "${LBX_PG_USER}"
          } > target.yml

      - name: Validate, deploy, start
        working-directory: ${{ steps.tree.outputs.dir }}
        run: |
          set -euo pipefail
          args=(-t "${TARGET}")
          if [ -n "${APP_NAME}" ]; then args+=(--var "app_name=${APP_NAME}"); fi
          databricks bundle validate "${args[@]}"
          databricks bundle deploy "${args[@]}"
          databricks bundle run "${args[@]}" lakebase_express

      - name: Report the app URL
        working-directory: ${{ steps.tree.outputs.dir }}
        run: |
          set -euo pipefail
          app="${APP_NAME:-lakebase-express}"
          url="$(databricks apps get "${app}" -o json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("url",""))')"
          printf '### Deployed `%s`\n\n- target: `%s`\n- source: %s\n- URL: %s\n' \
            "${app}" "${TARGET}" "${VERSION:-${GITHUB_SHA}}" "${url:-<none>}" >> "${GITHUB_STEP_SUMMARY}"
