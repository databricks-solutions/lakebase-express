name: Release

# Cutting a release is a tag push:
#
#     git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
#
# Every merge to main stays releasable; the tag decides when. A tag carrying a
# suffix (v1.0.0-rc.1) publishes as a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gates:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Package and publish
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --generate-notes diffs against the previous tag
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the SPA the app serves
        run: npm ci && npm run build
        working-directory: frontend
      - name: Package the deployable tree
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="lakebase-express-${version}"
          stage="${RUNNER_TEMP}/${name}"
          mkdir -p "${stage}"
          # Tracked files only, so gitignored local config (target.yml, *.env,
          # .databrickscfg) can never ride along, plus the compiled SPA — which is
          # gitignored but is what the app serves, and what databricks.yml
          # re-includes for bundle sync.
          git archive --format=tar HEAD | tar -x -C "${stage}"
          mkdir -p "${stage}/frontend/dist"
          cp -R frontend/dist/. "${stage}/frontend/dist/"
          {
            printf 'version=%s\n' "${version}"
            printf 'tag=%s\n' "${GITHUB_REF_NAME}"
            printf 'commit=%s\n' "${GITHUB_SHA}"
            printf 'built=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${stage}/VERSION"
          tar -czf "${name}.tar.gz" -C "${RUNNER_TEMP}" "${name}"
          sha256sum "${name}.tar.gz" > SHA256SUMS
          prerelease=false
          case "${version}" in *-*) prerelease=true ;; esac
          {
            printf 'version=%s\n' "${version}"
            printf 'archive=%s\n' "${name}.tar.gz"
            printf 'prerelease=%s\n' "${prerelease}"
          } >> "${GITHUB_OUTPUT}"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "${GITHUB_REF_NAME}")
          if [ "${PRERELEASE}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" "${ARCHIVE}" SHA256SUMS
      - name: Keep the artifact on the run too
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lakebase-express-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.archive }}
            SHA256SUMS
          retention-days: 30
