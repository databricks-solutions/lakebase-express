name: CI

# Gates every pull request and every push to main. release.yml calls this same
# workflow, so a tag can never publish something that would have failed a PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the same PR; never cancel a run on main or on a
  # tag, since those gate a release.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies from the hash-pinned lock
        run: pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: ruff check
        # Rule set and the three documented per-file ignores live in ruff.toml.
        run: ruff check --output-format=github .

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the README's Prerequisites promise; 3.13 is the newest
        # the suite is known to pass on.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies from the hash-pinned lock
        # --require-hashes refuses any archive whose digest is not in the lock, so a
        # compromised or swapped release on PyPI fails the build instead of running.
        # --no-deps because the lock already is the fully resolved set.
        run: pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: pytest
        # No workspace needed: conftest.py stubs the one live lookup, so the suite
        # runs with no Databricks credentials on the runner.
        run: pytest tests/ -q
      - name: Import the entrypoint app.yaml runs
        # Catches an import-time break that the unit tests could miss but that
        # would fail the app on its first start.
        run: python -c "from backend.main import app; assert app"

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vite 6 wants ^18 || ^20 || >=22; 20 is the LTS the build is exercised on.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Lockfile stays canonical
        # postinstall rewrites mirror URLs back to registry.npmjs.org; this fails if
        # a committed lockfile still pins a private mirror.
        run: npm run lockfile:check
      - name: Type-check and build the SPA
        run: npm run build # tsc -b && vite build
      - name: The app serves frontend/dist — fail if the build produced nothing
        run: test -f dist/index.html

  config:
    name: Deploy config (app.yaml + bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies from the hash-pinned lock
        run: pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Check app.yaml, databricks.yml and target.yml.sample agree
        # `databricks bundle validate` resolves the current user against the
        # workspace, so it needs credentials a PR must not have. This covers the
        # part that can be checked locally.
        run: python .github/scripts/check_bundle_config.py
